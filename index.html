<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Commercial Web</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div id="login-view" class="view">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-box-open fa-3x"></i>
                        <h2>Super Commercial</h2>
                        <p>Connectez-vous pour continuer</p>
                    </div>
                    <form id="login-form">
                        <div class="form-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="login-username" placeholder="Identifiant" required>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" placeholder="Mot de passe" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="login-btn">
                            Se connecter
                        </button>
                        <div id="login-error" class="error-msg"></div>
                    </form>
                </div>
            </div>
        </div>

        <div id="main-view" class="view hidden">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Super Commercial</h2>
                    <div id="user-info"></div>
                </div>
                <nav class="sidebar-nav">
                    <a href="#dashboard" class="nav-item active" data-route="dashboard"><i class="fas fa-home"></i> Accueil</a>
                    <a href="#ventes" class="nav-item" data-route="ventes"><i class="fas fa-shopping-cart"></i> Ventes</a>
                    <a href="#achats" class="nav-item" data-route="achats"><i class="fas fa-truck-loading"></i> Achats</a>
                    <a href="#produits" class="nav-item" data-route="produits"><i class="fas fa-box"></i> Produits</a>
                    <a href="#clients" class="nav-item" data-route="clients"><i class="fas fa-users"></i> Clients</a>
                    <a href="#fournisseurs" class="nav-item" data-route="fournisseurs"><i class="fas fa-truck"></i> Fournisseurs</a>
                    <a href="#charges" class="nav-item" data-route="charges"><i class="fas fa-file-invoice-dollar"></i> Charges</a>
                    <a href="#caisse" class="nav-item" data-route="caisse"><i class="fas fa-cash-register"></i> Caisse</a>
                    <a href="#situation" class="nav-item" data-route="situation"><i class="fas fa-chart-line"></i> Situation</a>
                    <a href="#statistiques" class="nav-item" data-route="statistiques"><i class="fas fa-chart-bar"></i> Stats</a>
                </nav>
                <div class="sidebar-footer">
                    <button id="logout-btn" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Quitter</button>
                </div>
            </aside>

            <main class="main-content">
                <header class="topbar">
                    <h1 id="page-title">Tableau de bord</h1>
                    <button id="chatbot-toggle" class="btn btn-circle"><i class="fas fa-robot"></i></button>
                </header>
                
                <div id="route-content" class="content-container">
                </div>
            </main>

            <nav class="bottom-nav">
                <a href="#dashboard" class="bnav-item active" data-route="dashboard"><i class="fas fa-home"></i><span>Accueil</span></a>
                <a href="#ventes" class="bnav-item" data-route="ventes"><i class="fas fa-shopping-cart"></i><span>Ventes</span></a>
                
                <div class="bnav-item scanner-wrapper">
                    <button id="fab-scanner" class="fab"><i class="fas fa-barcode"></i></button>
                    <span>Scanner</span>
                </div>

                <a href="#produits" class="bnav-item" data-route="produits"><i class="fas fa-box"></i><span>Produits</span></a>
                <a href="#menu" class="bnav-item" data-route="menu"><i class="fas fa-bars"></i><span>Menu</span></a>
            </nav>
        </div>
        
        <div id="scanner-overlay" class="overlay hidden">
            <div class="scanner-container">
                <div class="scanner-header">
                    <h3>Scanner un code-barres</h3>
                    <button id="close-scanner" class="btn btn-icon"><i class="fas fa-times"></i></button>
                </div>
                <div id="reader"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <!-- Modules -->
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/scanner.js"></script>
    <script src="js/modules/produits.js"></script>
    <!-- We will add other modules later -->
</body>
</html>
