<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Commercial</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Auth View -->
        <div id="auth-view" class="view hidden">
            <div class="auth-card">
                <h2>Connexion</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Utilisateur</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Mot de passe</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                    <div id="login-error" class="error-msg hidden"></div>
                </form>
            </div>
        </div>

        <!-- Main App View -->
        <div id="main-view" class="view hidden">
            
            <!-- Sidebar (Desktop) -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>SUPER COMMERCIAL</h3>
                </div>
                <nav class="sidebar-nav">
                    <a href="#dashboard" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="#ventes" class="nav-item"><i class="fas fa-shopping-cart"></i> Ventes</a>
                    <a href="#achats" class="nav-item"><i class="fas fa-shopping-bag"></i> Achats</a>
                    <a href="#produits" class="nav-item"><i class="fas fa-box"></i> Produits</a>
                    <a href="#clients" class="nav-item"><i class="fas fa-users"></i> Clients</a>
                    <a href="#fournisseurs" class="nav-item"><i class="fas fa-truck"></i> Fournisseurs</a>
                    <a href="#versements" class="nav-item"><i class="fas fa-money-bill-wave"></i> Versements</a>
                    <a href="#situation" class="nav-item"><i class="fas fa-chart-line"></i> Situation</a>
                    <a href="#charges" class="nav-item"><i class="fas fa-minus-circle"></i> Charges</a>
                    <a href="#caisse" class="nav-item"><i class="fas fa-cash-register"></i> Caisse</a>
                    <a href="#statistiques" class="nav-item"><i class="fas fa-chart-pie"></i> Statistiques</a>
                    <a href="#scanner" class="nav-item mobile-hidden"><i class="fas fa-barcode"></i> Scanner</a>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <!-- Header -->
                <header class="top-header">
                    <div class="header-left">
                        <button id="btn-menu-toggle" class="btn-icon mobile-only"><i class="fas fa-bars"></i></button>
                        <h2 id="page-title">Dashboard</h2>
                    </div>
                    <div class="header-right">
                        <div class="user-info">
                            <span id="user-name">User</span>
                            <span id="user-company" class="badge">Société</span>
                        </div>
                        <button id="btn-profile" class="btn-icon" title="Profil"><i class="fas fa-user-circle"></i></button>
                        <button id="btn-about" class="btn-icon" title="À propos"><i class="fas fa-info-circle"></i></button>
                        <button id="btn-logout" class="btn-icon text-danger" title="Déconnexion"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </header>

                <!-- Page Container -->
                <div id="page-container" class="page-container">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </main>

            <!-- Bottom Navigation (Mobile) -->
            <nav class="bottom-nav">
                <a href="#dashboard" class="nav-item"><i class="fas fa-home"></i></a>
                <a href="#ventes" class="nav-item"><i class="fas fa-shopping-cart"></i></a>
                <a href="#scanner" class="nav-item scanner-btn"><i class="fas fa-barcode"></i></a>
                <a href="#produits" class="nav-item"><i class="fas fa-box"></i></a>
                <a href="#more" class="nav-item" id="btn-mobile-more"><i class="fas fa-bars"></i></a>
            </nav>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p id="loading-text">Chargement...</p>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/products.js"></script>
    <script src="js/ventes.js"></script>
    <script src="js/achats.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/fournisseurs.js"></script>
    <script src="js/versements.js"></script>
    <script src="js/situation.js"></script>
    <script src="js/charges.js"></script>
    <script src="js/caisse.js"></script>
    <script src="js/statistiques.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/barcode.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
